name: RITZZ Video Pipeline

on:
  workflow_dispatch:
    inputs:
      test_run:
        description: Keep all generated output private or unlisted as a test run
        required: true
        type: boolean
        default: true
      target_duration_minutes:
        description: Target video duration in minutes
        required: true
        type: number
        default: 8
      minimum_duration_minutes:
        description: Minimum allowed video duration in minutes
        required: true
        type: number
        default: 8

permissions:
  contents: read
  issues: write

concurrency:
  group: ritzz-video-pipeline
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate pipeline prerequisites
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VIDIQ_MCP_API_KEY: ${{ secrets.VIDIQ_MCP_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      RITZZ_VOICE_ID: ${{ secrets.RITZZ_VOICE_ID }}
      GOOGLE_CLIENT_SECRETS_B64: ${{ secrets.GOOGLE_CLIENT_SECRETS_B64 }}
      GOOGLE_TOKEN_B64: ${{ secrets.GOOGLE_TOKEN_B64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate required secrets and OAuth JSON
        run: python scripts/validate_pipeline_prerequisites.py

  validate:
    name: Validate RITZZ pipeline
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run focused pipeline tests
        run: >-
          python -m pytest
          tests/test_m7_analytics.py
          tests/test_youtube_provider.py
          tests/test_video_pipeline_engine.py
          tests/test_topic_intelligence.py
          tests/test_topic_intelligence_learning.py
          tests/test_competitor_opportunities.py
          tests/test_config_settings.py
          tests/test_discover_pipeline_topics.py
          tests/test_pipeline_prerequisites.py
          tests/test_pipeline_topic_discovery.py
          tests/test_select_pipeline_topic.py
          tests/test_content_workflow.py::test_selected_candidate_is_linked_to_report_and_project
          -q

      - name: Enforce test-only release boundary
        if: ${{ inputs.test_run != true }}
        run: |
          echo "Public V1 publishing is not enabled yet. Set test_run to true." >&2
          exit 1

      - name: Write run manifest
        shell: bash
        env:
          TEST_RUN: ${{ inputs.test_run }}
        run: |
          mkdir -p .pipeline-artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "workflow": "RITZZ Video Pipeline",
              "topic_discovery_mode": "VIDIQ_TO_GPT",
              "test_run": os.environ["TEST_RUN"].lower() == "true",
              "public_publish_allowed": False,
              "approval_status": "PENDING",
          }
          Path(".pipeline-artifacts/run_manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-pipeline-validation-${{ github.run_id }}
          path: .pipeline-artifacts/
          if-no-files-found: error
          include-hidden-files: true

  discover-topics:
    name: Generate and score topic candidates
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create-approval-issue.outputs.issue_number }}
      candidate_count: ${{ steps.discover.outputs.candidate_count }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VIDIQ_MCP_API_KEY: ${{ secrets.VIDIQ_MCP_API_KEY }}
      RITZZ_INVENTORY_FILE: data/content_inventory.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and score 3–5 candidates
        id: discover
        run: python scripts/discover_pipeline_topics.py

      - name: Upload topic candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-topic-candidates-${{ github.run_id }}
          path: .pipeline-artifacts/
          if-no-files-found: warn
          include-hidden-files: true

      - name: Create browser approval issue
        id: create-approval-issue
        uses: actions/github-script@v7
        env:
          CANDIDATE_SUMMARY: .pipeline-artifacts/topic_candidates.md
          CANDIDATE_COUNT: ${{ steps.discover.outputs.candidate_count }}
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync(process.env.CANDIDATE_SUMMARY, 'utf8');
            const candidateCount = Number(process.env.CANDIDATE_COUNT);
            if (!Number.isInteger(candidateCount) || candidateCount < 3 || candidateCount > 5) {
              core.setFailed(`Expected 3–5 topic candidates; received ${process.env.CANDIDATE_COUNT}.`);
              return;
            }
            const choices = Array.from({ length: candidateCount }, (_, index) => `\`${index + 1}\``).join(', ');
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `RITZZ topic approval - run ${context.runId}`,
              body: `${summary}\n\nReply with exactly one selection label: ${choices}. Only trusted repository collaborators may approve this run.`,
            });
            core.setOutput('issue_number', issue.data.number);
            core.summary.addHeading('Topic approval issue');
            core.summary.addLink(`Open topic approval issue #${issue.data.number}`, issue.data.html_url);
            await core.summary.write();

  select-topic:
    name: Wait for topic selection
    needs: discover-topics
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.wait-for-selection.outputs.selection }}
    env:
      ISSUE_NUMBER: ${{ needs.discover-topics.outputs.issue_number }}
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_COUNT: ${{ needs.discover-topics.outputs.candidate_count }}
      RITZZ_TARGET_DURATION_MINUTES: ${{ inputs.target_duration_minutes }}
      RITZZ_MINIMUM_DURATION_MINUTES: ${{ inputs.minimum_duration_minutes }}
    steps:
      - name: Wait for numbered browser selection
        id: wait-for-selection
        shell: bash
        run: |
          set -euo pipefail
          selection=""
          for attempt in $(seq 1 240); do
            selection=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              --jq '.[] | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR") | .body' \
              | tr -d '\r' \
              | awk -v max="$CANDIDATE_COUNT" '/^[1-5]$/ && $0 <= max {value=$0} END{print value}')
            if [[ "$selection" =~ ^[1-5]$ ]] && (( selection <= CANDIDATE_COUNT )); then
              echo "Selected topic number: $selection"
              echo "selection=$selection" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for a trusted collaborator to reply with a selection from 1 to ${CANDIDATE_COUNT} (attempt $attempt/240)."
            sleep 30
          done
          echo "Timed out waiting for topic selection." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download topic candidates
        uses: actions/download-artifact@v4
        with:
          name: ritzz-topic-candidates-${{ github.run_id }}
          path: .pipeline-artifacts

      - name: Persist selected topic
        env:
          RITZZ_SELECTED_TOPIC_NUMBER: ${{ steps.wait-for-selection.outputs.selection }}
        run: python scripts/select_pipeline_topic.py

      - name: Upload approved topic selection
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-approved-topic-${{ github.run_id }}
          path: .pipeline-artifacts/topic_selection.json
          if-no-files-found: error
          include-hidden-files: true

  topic-approval:
    name: Approve selected topic
    needs: select-topic
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ needs.select-topic.outputs.selection }}
    environment:
      name: ritzz-topic-approval
    steps:
      - name: Record topic approval boundary
        run: |
          echo "Topic ${{ needs.select-topic.outputs.selection }} selected."
          echo "Approve this environment to continue into production stages."

  test-approval:
    name: Human approval for test pipeline
    needs: topic-approval
    runs-on: ubuntu-latest
    environment:
      name: ritzz-test-approval
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Confirm approval boundary
        run: |
          echo "Test pipeline approved."
          echo "Topic discovery mode: GPT generation with vidIQ keyword-score validation."
          echo "Selected topic number: ${{ needs.topic-approval.outputs.selection }}"
          echo "All output must remain private or unlisted."
          echo "Video generation and publishing stages will be added behind this gate."

  content-preparation:
    name: Research, outline, and script
    needs: test-approval
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VIDIQ_MCP_API_KEY: ${{ secrets.VIDIQ_MCP_API_KEY }}
      RITZZ_PIPELINE_ARTIFACTS: .pipeline-artifacts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download topic candidates
        uses: actions/download-artifact@v4
        with:
          name: ritzz-topic-candidates-${{ github.run_id }}
          path: .pipeline-artifacts

      - name: Download approved topic
        uses: actions/download-artifact@v4
        with:
          name: ritzz-approved-topic-${{ github.run_id }}
          path: .pipeline-artifacts

      - name: Run approved content workflow
        run: python scripts/run_approved_content_workflow.py

      - name: Archive generated project artifacts
        shell: bash
        run: |
          project_id=$(python -c "import json; print(json.load(open('.pipeline-artifacts/content_workflow_result.json'))['project_id'])")
          project_name=$(find projects -mindepth 1 -maxdepth 1 -type d -name "${project_id}_*" -printf "%f\n" | head -n 1)
          tar -czf .pipeline-artifacts/content-project.tar.gz -C projects "$project_name"

      - name: Upload content artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-content-project-${{ github.run_id }}
          path: .pipeline-artifacts/
          if-no-files-found: error
          include-hidden-files: true

  voice-generation:
    name: Generate and validate narration
    needs: content-preparation
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      RITZZ_VOICE_ID: ${{ secrets.RITZZ_VOICE_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download content project
        uses: actions/download-artifact@v4
        with:
          name: ritzz-content-project-${{ github.run_id }}
          path: .pipeline-artifacts

      - name: Extract content project
        shell: bash
        run: tar -xzf .pipeline-artifacts/content-project.tar.gz

      - name: Read project ID
        id: project
        shell: bash
        run: |
          project_id=$(python -c "import json; print(json.load(open('.pipeline-artifacts/content_workflow_result.json'))['project_id'])")
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Generate and validate narration
        env:
          RITZZ_PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: python scripts/run_voice_stage.py

      - name: Archive voice project artifacts
        shell: bash
        run: |
          project_name=$(find projects -mindepth 1 -maxdepth 1 -type d -name "${{ steps.project.outputs.project_id }}_*" -printf "%f\n" | head -n 1)
          tar -czf .pipeline-artifacts/voice-project.tar.gz -C projects "$project_name"

      - name: Upload voice artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-voice-project-${{ github.run_id }}
          path: .pipeline-artifacts/
          if-no-files-found: error
          include-hidden-files: true

  pipeline-placeholder:
    name: Production stages pending M8 implementation
    needs: private-upload
    runs-on: ubuntu-latest
    steps:
      - name: Report current implementation boundary
        run: |
          echo "The CI control plane is active."
          echo "Private test upload completed after human approval."
          echo "Public publication remains disabled for M8/M9 test runs."

  image-generation:
    name: Generate timed-scene images
    needs: storyboard-generation
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download storyboard project
        uses: actions/download-artifact@v4
        with:
          name: ritzz-storyboard-project-${{ github.run_id }}
          path: .pipeline-artifacts

      - name: Extract storyboard project
        shell: bash
        run: tar -xzf .pipeline-artifacts/storyboard-project.tar.gz

      - name: Read project ID
        id: project
        shell: bash
        run: |
          project_id=$(python -c "import json; print(json.load(open('.pipeline-artifacts/content_workflow_result.json'))['project_id'])")
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Generate timed-scene images
        env:
          RITZZ_PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: python scripts/run_image_stage.py

      - name: Archive image project artifacts
        shell: bash
        run: |
          project_name=$(find projects -mindepth 1 -maxdepth 1 -type d -name "${{ steps.project.outputs.project_id }}_*" -printf "%f\n" | head -n 1)
          tar -czf .pipeline-artifacts/image-project.tar.gz -C projects "$project_name"

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-image-project-${{ github.run_id }}
          path: .pipeline-artifacts/
          if-no-files-found: error
          include-hidden-files: true

  render-video:
    name: Render and run technical QA
    needs: image-generation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download image project
        uses: actions/download-artifact@v4
        with:
          name: ritzz-image-project-${{ github.run_id }}
          path: .pipeline-artifacts

      - name: Extract image project
        shell: bash
        run: tar -xzf .pipeline-artifacts/image-project.tar.gz

      - name: Read project ID
        id: project
        shell: bash
        run: |
          project_id=$(python -c "import json; print(json.load(open('.pipeline-artifacts/content_workflow_result.json'))['project_id'])")
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Render test video and run technical QA
        env:
          RITZZ_PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: python scripts/run_render_stage.py

      - name: Archive rendered project
        shell: bash
        run: |
          project_name=$(find projects -mindepth 1 -maxdepth 1 -type d -name "${{ steps.project.outputs.project_id }}_*" -printf "%f\n" | head -n 1)
          tar -czf .pipeline-artifacts/rendered-project.tar.gz -C projects "$project_name"

      - name: Upload rendered video artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-rendered-project-${{ github.run_id }}
          path: .pipeline-artifacts/
          if-no-files-found: error
          include-hidden-files: true

  video-approval:
    name: Human approval for generated test video
    needs: render-video
    runs-on: ubuntu-latest
    environment:
      name: ritzz-video-approval
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Confirm video review boundary
        run: |
          echo "Rendered test video passed deterministic technical QA."
          echo "Review the uploaded artifact before approving this environment."
          echo "This is a test video and must remain private or unlisted."

  packaging-approval:
    name: Human approval for packaging
    needs: video-approval
    runs-on: ubuntu-latest
    environment:
      name: ritzz-packaging-approval
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Confirm packaging review boundary
        run: |
          echo "Packaging metadata is ready for review."
          echo "Approve this environment to permit the private test upload."
          echo "Public publication remains disabled."

  private-upload:
    name: Upload test video privately
    needs: packaging-approval
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLIENT_SECRETS_B64: ${{ secrets.GOOGLE_CLIENT_SECRETS_B64 }}
      GOOGLE_TOKEN_B64: ${{ secrets.GOOGLE_TOKEN_B64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download rendered project
        uses: actions/download-artifact@v4
        with:
          name: ritzz-rendered-project-${{ github.run_id }}
          path: .pipeline-artifacts

      - name: Extract rendered project
        shell: bash
        run: tar -xzf .pipeline-artifacts/rendered-project.tar.gz

      - name: Read project ID
        id: project
        shell: bash
        run: |
          project_id=$(python -c "import json; print(json.load(open('.pipeline-artifacts/content_workflow_result.json'))['project_id'])")
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Write OAuth files from GitHub Secrets
        shell: bash
        run: |
          printf '%s' "$GOOGLE_CLIENT_SECRETS_B64" | base64 --decode > "$RUNNER_TEMP/youtube-client-secrets.json"
          printf '%s' "$GOOGLE_TOKEN_B64" | base64 --decode > "$RUNNER_TEMP/youtube-token.json"

      - name: Upload test video privately
        env:
          RITZZ_PROJECT_ID: ${{ steps.project.outputs.project_id }}
          GOOGLE_CLIENT_SECRETS_FILE: ${{ runner.temp }}/youtube-client-secrets.json
          GOOGLE_TOKEN_FILE: ${{ runner.temp }}/youtube-token.json
        run: python scripts/run_private_upload_stage.py

  storyboard-generation:
    name: Build audio-timed storyboard
    needs: voice-generation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download voice project
        uses: actions/download-artifact@v4
        with:
          name: ritzz-voice-project-${{ github.run_id }}
          path: .pipeline-artifacts

      - name: Extract voice project
        shell: bash
        run: tar -xzf .pipeline-artifacts/voice-project.tar.gz

      - name: Read project ID
        id: project
        shell: bash
        run: |
          project_id=$(python -c "import json; print(json.load(open('.pipeline-artifacts/content_workflow_result.json'))['project_id'])")
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Build narrative and audio-timed storyboards
        env:
          RITZZ_PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: python scripts/run_storyboard_stage.py

      - name: Archive storyboard project artifacts
        shell: bash
        run: |
          project_name=$(find projects -mindepth 1 -maxdepth 1 -type d -name "${{ steps.project.outputs.project_id }}_*" -printf "%f\n" | head -n 1)
          tar -czf .pipeline-artifacts/storyboard-project.tar.gz -C projects "$project_name"

      - name: Upload storyboard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-storyboard-project-${{ github.run_id }}
          path: .pipeline-artifacts/
          if-no-files-found: error
          include-hidden-files: true
