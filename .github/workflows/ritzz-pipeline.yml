      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install FFmpeg for image text overlays
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-dejavu-core
          ffmpeg -version

      - name: Download storyboard project
        if: ${{ needs.restore-production.outputs.rerun_from_stage != 'image_generation' }}
        uses: actions/download-artifact@v4
        with:
          name: ritzz-production-${{ needs.restore-production.outputs.production_id }}-storyboard_generation
          run-id: ${{ needs.restore-production.outputs.effective_mode == 'RESUME' && needs.restore-production.outputs.resume_from_index == '5' && needs.restore-production.outputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: .pipeline-artifacts

      - name: Download rerun project
        if: ${{ needs.restore-production.outputs.rerun_from_stage == 'image_generation' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.restore-production.outputs.source_artifact }}
          run-id: ${{ needs.restore-production.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: .pipeline-artifacts

      - name: Extract storyboard project
        if: ${{ needs.restore-production.outputs.rerun_from_stage != 'image_generation' }}
        shell: bash
        run: mkdir -p projects && tar -xzf .pipeline-artifacts/storyboard-project.tar.gz -C projects

      - name: Extract rerun project
        if: ${{ needs.restore-production.outputs.rerun_from_stage == 'image_generation' }}
        shell: bash
        run: mkdir -p projects && tar -xzf .pipeline-artifacts/rerun-project.tar.gz -C projects

      - name: Read project ID
        id: project
        shell: bash
        run: |
          project_id=$(python -c "import json; print(json.load(open('.pipeline-artifacts/content_workflow_result.json'))['project_id'])")
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Generate timed-scene images
        shell: bash
        env:
          RITZZ_PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          stage=image_generation
          python scripts/manage_pipeline_production.py start --stage "$stage"
          trap 'python scripts/manage_pipeline_production.py fail --stage "$stage" --error "Image generation command failed."' ERR
          python scripts/run_image_stage.py

      - name: Archive image project artifacts
        shell: bash
        run: |
          project_name=$(find projects -mindepth 1 -maxdepth 1 -type d -name "${{ steps.project.outputs.project_id }}_*" -printf "%f\n" | head -n 1)
          tar -czf .pipeline-artifacts/image-project.tar.gz -C projects "$project_name"

      - name: Complete image generation checkpoint
        run: python scripts/manage_pipeline_production.py complete --stage image_generation --artifacts image-project.tar.gz

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-production-${{ needs.restore-production.outputs.production_id }}-image_generation
          path: .pipeline-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  render-video:
