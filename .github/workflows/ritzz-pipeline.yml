name: RITZZ Video Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Start a new production or resume a saved production
        required: true
        type: choice
        options:
          - NEW
          - RESUME
        default: NEW
      production_id:
        description: Existing production ID for RESUME; optional custom ID for NEW
        required: false
        type: string
      project_id:
        description: Existing project ID or production ID to find its saved checkpoint for RESUME
        required: false
        type: string
      rerun_from_stage:
        description: Restart completed project stages from this point, or continue normally
        required: true
        type: choice
        options:
          - NONE
          - voice_generation
          - storyboard_generation
          - image_generation
          - render_video
          - private_upload
        default: NONE
      confirm_deleted_video:
        description: Confirm the existing private YouTube video was deleted and authorize a replacement upload
        required: true
        type: boolean
        default: false
      test_run:
        description: Keep all generated output private or unlisted as a test run
        required: true
        type: boolean
        default: true
      target_duration_minutes:
        description: Target video duration in minutes
        required: true
        type: number
        default: 8
      minimum_duration_minutes:
        description: Minimum allowed video duration in minutes
        required: true
        type: number
        default: 8

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: ritzz-video-pipeline
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate pipeline prerequisites
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VIDIQ_MCP_API_KEY: ${{ secrets.VIDIQ_MCP_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      RITZZ_VOICE_ID: ${{ secrets.RITZZ_VOICE_ID }}
      GOOGLE_CLIENT_SECRETS_B64: ${{ secrets.GOOGLE_CLIENT_SECRETS_B64 }}
      GOOGLE_TOKEN_B64: ${{ secrets.GOOGLE_TOKEN_B64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate required secrets and OAuth JSON
        run: python scripts/validate_pipeline_prerequisites.py

  validate:
    name: Validate RITZZ pipeline
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install FFmpeg and overlay font for media tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-dejavu-core

      - name: Run focused pipeline tests
        run: >-
          python -m pytest
          tests/test_audio_timed_storyboard.py
          tests/test_image_batch.py
          tests/test_image_overlays.py
          tests/test_image_prompt_builder.py
          tests/test_packaging_engine.py
          tests/test_pilot_video_qa.py
          tests/test_run_render_stage.py
          tests/test_upload_thumbnail_recovery.py
          tests/test_video_render_engine.py
          tests/test_m7_analytics.py
          tests/test_youtube_provider.py
          tests/test_video_pipeline_engine.py
          tests/test_topic_intelligence.py
          tests/test_topic_intelligence_learning.py
          tests/test_competitor_opportunities.py
          tests/test_config_settings.py
          tests/test_discover_pipeline_topics.py
          tests/test_pipeline_prerequisites.py
          tests/test_pipeline_topic_discovery.py
          tests/test_run_approved_content_workflow.py
          tests/test_select_pipeline_topic.py
          tests/test_production_state.py
          tests/test_resolve_production_by_project.py
          tests/test_authorize_deleted_video_replacement.py
          tests/test_publishing_engine.py
          tests/test_content_workflow.py::test_selected_candidate_is_linked_to_report_and_project
          -q

      - name: Enforce test-only release boundary
        if: ${{ inputs.test_run != true }}
        run: |
          echo "Public V1 publishing is not enabled yet. Set test_run to true." >&2
          exit 1

      - name: Write run manifest
        shell: bash
        env:
          TEST_RUN: ${{ inputs.test_run }}
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p .pipeline-artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "workflow": "RITZZ Video Pipeline",
              "topic_discovery_mode": "VIDIQ_TO_GPT",
              "mode": os.environ["MODE"],
              "test_run": os.environ["TEST_RUN"].lower() == "true",
              "public_publish_allowed": False,
              "approval_status": "PENDING",
          }
          Path(".pipeline-artifacts/run_manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-pipeline-validation-${{ github.run_id }}
          path: .pipeline-artifacts/
          if-no-files-found: error
          include-hidden-files: true

  restore-production:
    name: Create or restore production checkpoint
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      production_id: ${{ steps.resolve-by-project.outputs.production_id || steps.resolve.outputs.production_id }}
      source_run_id: ${{ inputs.rerun_from_stage != 'NONE' && github.run_id || steps.resolve-by-project.outputs.source_run_id || steps.resolve.outputs.source_run_id }}
      source_artifact: ${{ steps.resolve-by-project.outputs.source_artifact || steps.resolve.outputs.source_artifact }}
      resume_from_index: ${{ steps.inspect.outputs.resume_from_index || steps.resolve-by-project.outputs.resume_from_index || steps.resolve.outputs.resume_from_index }}
      approval_issue_number: ${{ steps.inspect.outputs.approval_issue_number }}
      effective_mode: ${{ steps.resolve-by-project.outputs.effective_mode || steps.resolve.outputs.effective_mode }}
      rerun_from_stage: ${{ inputs.rerun_from_stage != 'NONE' && inputs.rerun_from_stage || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate project-based rerun inputs
        if: ${{ inputs.rerun_from_stage != 'NONE' || inputs.project_id != '' || inputs.confirm_deleted_video }}
        env:
          MODE: ${{ inputs.mode }}
          PROJECT_ID: ${{ inputs.project_id }}
          RERUN_FROM_STAGE: ${{ inputs.rerun_from_stage }}
          CONFIRM_DELETED_VIDEO: ${{ inputs.confirm_deleted_video }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" != "RESUME" ]]; then
            echo "Project-ID lookup and stage reruns require mode=RESUME." >&2
            exit 1
          fi
          if [[ -z "$PROJECT_ID" ]]; then
            echo "A project_id is required when rerun_from_stage is selected." >&2
            exit 1
          fi
          if [[ "$CONFIRM_DELETED_VIDEO" == "true" && "$RERUN_FROM_STAGE" != "private_upload" ]]; then
            echo "Deleted-video replacement confirmation is valid only with rerun_from_stage=private_upload." >&2
            exit 1
          fi

      - name: Resolve production checkpoint by project ID
        id: resolve-by-project
        if: ${{ inputs.mode == 'RESUME' && inputs.project_id != '' }}
        env:
          RITZZ_PROJECT_ID: ${{ inputs.project_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/resolve_production_by_project.py

      - name: Resolve production checkpoint
        id: resolve
        if: ${{ inputs.project_id == '' || inputs.mode == 'NEW' }}
        uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
          REQUESTED_PRODUCTION_ID: ${{ inputs.production_id }}
          RERUN_FROM_STAGE: ${{ inputs.rerun_from_stage }}
        with:
          script: |
            const mode = process.env.MODE;
            const requestedId = process.env.REQUESTED_PRODUCTION_ID.trim();
            if (mode !== 'NEW' && mode !== 'RESUME') {
              core.setFailed(`Unsupported production mode: ${mode}`);
              return;
            }
            if (mode === 'RESUME' && !requestedId) {
              core.setFailed('PRODUCTION_NOT_FOUND: production_id is required for RESUME.');
              return;
            }
            const productionId = mode === 'NEW'
              ? (requestedId || `run-${context.runId}`)
              : requestedId;
            if (!/^[A-Za-z0-9][A-Za-z0-9_-]{0,79}$/.test(productionId)) {
              core.setFailed('Production ID must be 1–80 letters, numbers, underscores, or hyphens.');
              return;
            }
            const allArtifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const prefix = `ritzz-production-${productionId}-`;
            const productionArtifacts = allArtifacts.filter(
              artifact => artifact.name.startsWith(prefix)
            );
            let effectiveMode = mode;
            if (mode === 'NEW') {
              const artifactsFromOtherRuns = productionArtifacts.filter(
                artifact => artifact.workflow_run.id !== context.runId
              );
              const approvalTitle = `RITZZ topic approval - production ${productionId}`;
              const matchingIssues = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${approvalTitle}"`,
                per_page: 10
              });
              const issueExists = matchingIssues.data.items.some(
                issue => issue.title === approvalTitle
              );
              if (artifactsFromOtherRuns.length) {
                core.setFailed(`PRODUCTION_ALREADY_EXISTS: ${productionId}`);
                return;
              }
              if (issueExists && !productionArtifacts.some(artifact =>
                artifact.workflow_run.id === context.runId
              )) {
                core.setFailed(`PRODUCTION_ALREADY_EXISTS: ${productionId}`);
                return;
              }
              if (productionArtifacts.length) {
                effectiveMode = 'RESUME';
              }
            }
            if (effectiveMode === 'NEW') {
              core.setOutput('production_id', productionId);
              core.setOutput('source_run_id', String(context.runId));
              core.setOutput('source_artifact', '');
              core.setOutput('resume_from_index', '0');
              core.setOutput('checkpoint_index', '-1');
              core.setOutput('effective_mode', effectiveMode);
              return;
            }
            const stages = [
              'topic_discovery',
              'topic_selection',
              'content_preparation',
              'voice_generation',
              'storyboard_generation',
              'image_generation',
              'render_video',
              'private_upload'
            ];
            let checkpoint;
            let checkpointIndex = -1;
            for (let index = stages.length - 1; index >= 0; index--) {
              checkpoint = productionArtifacts.find(
                artifact => artifact.name === `${prefix}${stages[index]}` && !artifact.expired
              );
              if (checkpoint) {
                checkpointIndex = index;
                break;
              }
            }
            if (!checkpoint) {
              core.setFailed(`PRODUCTION_NOT_FOUND: no saved checkpoint for ${productionId}.`);
              return;
            }
            core.setOutput('production_id', productionId);
            core.setOutput('source_run_id', String(checkpoint.workflow_run.id));
            core.setOutput('source_artifact', checkpoint.name);
            core.setOutput('resume_from_index', String(checkpointIndex + 1));
            core.setOutput('checkpoint_index', String(checkpointIndex));
            core.setOutput('effective_mode', effectiveMode);

      - name: Download saved production checkpoint
        if: ${{ steps.resolve-by-project.outputs.effective_mode == 'RESUME' || steps.resolve.outputs.effective_mode == 'RESUME' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.resolve-by-project.outputs.source_artifact || steps.resolve.outputs.source_artifact }}
          run-id: ${{ steps.resolve-by-project.outputs.source_run_id || steps.resolve.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: .pipeline-artifacts

      - name: Validate checkpoint and expose progress
        id: inspect
        if: ${{ steps.resolve-by-project.outputs.effective_mode == 'RESUME' || steps.resolve.outputs.effective_mode == 'RESUME' }}
        env:
          RITZZ_PRODUCTION_ID: ${{ steps.resolve-by-project.outputs.production_id || steps.resolve.outputs.production_id }}
          RITZZ_PIPELINE_ARTIFACTS: .pipeline-artifacts
          CHECKPOINT_INDEX: ${{ steps.resolve-by-project.outputs.checkpoint_index || steps.resolve.outputs.checkpoint_index }}
          RERUN_FROM_STAGE: ${{ inputs.rerun_from_stage }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .pipeline-artifacts/production_state.json ]]; then
            echo "STATE_ARTIFACT_MISMATCH: saved production checkpoint has no state file." >&2
            exit 1
          fi
          python scripts/manage_pipeline_production.py resume
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path(".pipeline-artifacts/production_state.json").read_text(encoding="utf-8"))
          stages = list(state["stages"])
          checkpoint_index = int(os.environ["CHECKPOINT_INDEX"])
          rerun_stage = os.environ["RERUN_FROM_STAGE"]
          expected_stage = stages[checkpoint_index]
          expected_stage_state = state["stages"][expected_stage]
          expected_status = expected_stage_state["status"]
          failed_stage_retry = (
              expected_status == "failed"
              and state.get("status") == "failed"
              and state.get("current_stage") == expected_stage
              and bool(expected_stage_state.get("artifacts"))
          )
          interrupted_private_upload = (
              expected_stage == "private_upload"
              and expected_status == "running"
              and state.get("current_stage") == "private_upload"
              and state.get("private_upload_intent")
          )
          if (
              expected_status != "completed"
              and not failed_stage_retry
              and not interrupted_private_upload
          ):
              raise SystemExit(f"STATE_ARTIFACT_MISMATCH: selected checkpoint {expected_stage} is not completed.")
          upload_intent = state.get("private_upload_intent")
          if (
              expected_stage == "private_upload"
              and expected_status == "running"
              and (
                  upload_intent.get("run_id") != os.environ["GITHUB_RUN_ID"]
                  or upload_intent.get("run_attempt") != int(os.environ["GITHUB_RUN_ATTEMPT"])
              )
          ):
              raise SystemExit(
                  "PUBLISH_ATTEMPT_RECONCILIATION_REQUIRED: check YouTube before resuming "
                  "an interrupted private upload."
              )
          if rerun_stage != "NONE":
              if rerun_stage not in stages[3:]:
                  raise SystemExit(f"INVALID_RERUN_STAGE: {rerun_stage}")
              if state.get("project_id") is None:
                  raise SystemExit("PROJECT_ID_REQUIRED: rerun stage requires a saved project ID.")
              import subprocess

              subprocess.run(
                  [
                      "python",
                      "scripts/manage_pipeline_production.py",
                      "restart",
                      "--stage",
                      rerun_stage,
                  ],
                  check=True,
              )
              state = json.loads(Path(".pipeline-artifacts/production_state.json").read_text(encoding="utf-8"))
              archive_names = {
                  "content_preparation": "content-project.tar.gz",
                  "voice_generation": "voice-project.tar.gz",
                  "storyboard_generation": "storyboard-project.tar.gz",
                  "image_generation": "image-project.tar.gz",
                  "render_video": "rendered-project.tar.gz",
                  "private_upload": "private-upload-project.tar.gz",
              }
              for source_stage in reversed(stages[2:checkpoint_index + 1]):
                  archive_name = archive_names.get(source_stage)
                  archive_path = Path(".pipeline-artifacts") / archive_name if archive_name else None
                  if archive_path and archive_path.is_file():
                      import shutil

                      shutil.copy2(archive_path, ".pipeline-artifacts/rerun-project.tar.gz")
                      break
              else:
                  raise SystemExit(
                      "PROJECT_ARCHIVE_MISSING: saved checkpoint contains no project archive to rerun."
                  )
          for index, stage in enumerate(stages):
              if state["stages"][stage]["status"] != "completed":
                  break
          else:
              index = len(stages)
          issue_number = state.get("approval_issue_number") or ""
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"resume_from_index={index}\n")
              output.write(f"approval_issue_number={issue_number}\n")
          PY

      - name: Publish rerun checkpoint for downstream stage jobs
        if: ${{ inputs.rerun_from_stage != 'NONE' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve-by-project.outputs.source_artifact || steps.resolve.outputs.source_artifact }}
          path: .pipeline-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

      - name: Report production identity
        env:
          PRODUCTION_ID: ${{ steps.resolve-by-project.outputs.production_id || steps.resolve.outputs.production_id }}
          PROJECT_ID: ${{ inputs.project_id }}
          RERUN_FROM_STAGE: ${{ inputs.rerun_from_stage }}
          EFFECTIVE_MODE: ${{ steps.resolve-by-project.outputs.effective_mode || steps.resolve.outputs.effective_mode }}
          RESUME_FROM_INDEX: ${{ steps.inspect.outputs.resume_from_index || steps.resolve-by-project.outputs.resume_from_index || steps.resolve.outputs.resume_from_index }}
        shell: bash
        run: |
          {
            echo "## Production checkpoint"
            echo "- Production ID: \`$PRODUCTION_ID\`"
            echo "- Mode: \`$EFFECTIVE_MODE\`"
            echo "- Resume stage index: \`$RESUME_FROM_INDEX\`"
            if [[ -n "$PROJECT_ID" ]]; then echo "- Project ID: \`$PROJECT_ID\`"; fi
            if [[ "$RERUN_FROM_STAGE" != "NONE" ]]; then echo "- Restart from stage: \`$RERUN_FROM_STAGE\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  discover-topics:
    name: Generate and score topic candidates
    needs: [validate, restore-production]
    if: ${{ always() && needs.validate.result == 'success' && needs.restore-production.result == 'success' && (needs.restore-production.outputs.effective_mode == 'NEW' || needs.restore-production.outputs.resume_from_index == '0') }}
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create-approval-issue.outputs.issue_number }}
      candidate_count: ${{ steps.discover.outputs.candidate_count }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VIDIQ_MCP_API_KEY: ${{ secrets.VIDIQ_MCP_API_KEY }}
      RITZZ_INVENTORY_FILE: data/content_inventory.json
      RITZZ_PRODUCTION_ID: ${{ needs.restore-production.outputs.production_id }}
      RITZZ_PIPELINE_ARTIFACTS: .pipeline-artifacts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Initialize production state
        if: ${{ needs.restore-production.outputs.effective_mode == 'NEW' }}
        run: python scripts/manage_pipeline_production.py initialize --production-id "${{ needs.restore-production.outputs.production_id }}"

      - name: Generate and score 3–5 candidates
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          stage=topic_discovery
          python scripts/manage_pipeline_production.py start --stage "$stage"
          trap 'python scripts/manage_pipeline_production.py fail --stage "$stage" --error "Topic discovery command failed."' ERR
          python scripts/discover_pipeline_topics.py
          python scripts/manage_pipeline_production.py complete --stage "$stage" --artifacts topic_candidates.json topic_candidates.md topic_discovery_diagnostics.json

      - name: Persist topic discovery before creating approval issue
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-production-${{ needs.restore-production.outputs.production_id }}-topic_discovery
          path: .pipeline-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

      - name: Create browser approval issue
        id: create-approval-issue
        uses: actions/github-script@v7
        env:
          CANDIDATE_SUMMARY: .pipeline-artifacts/topic_candidates.md
          CANDIDATE_COUNT: ${{ steps.discover.outputs.candidate_count }}
          PRODUCTION_ID: ${{ needs.restore-production.outputs.production_id }}
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync(process.env.CANDIDATE_SUMMARY, 'utf8');
            const candidateCount = Number(process.env.CANDIDATE_COUNT);
            if (!Number.isInteger(candidateCount) || candidateCount < 2 || candidateCount > 5) {
              core.setFailed(`Expected 2–5 topic candidates; received ${process.env.CANDIDATE_COUNT}.`);
              return;
            }
            const choices = Array.from({ length: candidateCount }, (_, index) => `\`${index + 1}\``).join(', ');
            const title = `RITZZ topic approval - production ${process.env.PRODUCTION_ID}`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const priorIssue = existing.find(issue => issue.title === title);
            const issue = priorIssue || (await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `${summary}\n\nReply with exactly one selection label: ${choices}. Only trusted repository collaborators may approve this run.`,
            })).data;
            core.setOutput('issue_number', issue.number);
            core.summary.addHeading('Topic approval issue');
            core.summary.addLink(`Open topic approval issue #${issue.number}`, issue.html_url);
            await core.summary.write();

      - name: Save approval issue number
        env:
          ISSUE_NUMBER: ${{ steps.create-approval-issue.outputs.issue_number }}
        run: python scripts/manage_pipeline_production.py issue --issue-number "$ISSUE_NUMBER"

      - name: Upload topic discovery checkpoint
        if: ${{ always() && steps.discover.outcome == 'success' && steps.create-approval-issue.outcome == 'success' && steps.create-approval-issue.outputs.issue_number != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-production-${{ needs.restore-production.outputs.production_id }}-topic_discovery
          path: .pipeline-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

      - name: Upload failed discovery diagnostics
        if: ${{ failure() && hashFiles('.pipeline-artifacts/topic_discovery_diagnostics.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-topic-discovery-diagnostics-${{ github.run_id }}
          path: .pipeline-artifacts/
          if-no-files-found: warn
          include-hidden-files: true

  select-topic:
    name: Wait for topic selection
    needs: [discover-topics, restore-production]
    if: ${{ always() && needs.restore-production.result == 'success' && needs.discover-topics.result != 'failure' && needs.discover-topics.result != 'cancelled' && (needs.restore-production.outputs.effective_mode == 'NEW' || needs.restore-production.outputs.resume_from_index <= 1) }}
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.wait-for-selection.outputs.selection }}
    env:
      GH_TOKEN: ${{ github.token }}
      RITZZ_PRODUCTION_ID: ${{ needs.restore-production.outputs.production_id }}
      RITZZ_PIPELINE_ARTIFACTS: .pipeline-artifacts
      RITZZ_TARGET_DURATION_MINUTES: ${{ inputs.target_duration_minutes }}
      RITZZ_MINIMUM_DURATION_MINUTES: ${{ inputs.minimum_duration_minutes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download topic candidates
        uses: actions/download-artifact@v4
        with:
          name: ritzz-production-${{ needs.restore-production.outputs.production_id }}-topic_discovery
          run-id: ${{ needs.restore-production.outputs.effective_mode == 'RESUME' && needs.restore-production.outputs.resume_from_index == '1' && needs.restore-production.outputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: .pipeline-artifacts

      - name: Read candidate count
        id: candidate-count
        shell: bash
        run: |
          count=$(python -c "import json; print(len(json.load(open('.pipeline-artifacts/topic_candidates.json', encoding='utf-8'))['candidates']))")
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Resolve approval issue
        id: approval-issue
        env:
          SAVED_ISSUE_NUMBER: ${{ needs.restore-production.outputs.approval_issue_number }}
          CANDIDATE_SUMMARY: .pipeline-artifacts/topic_candidates.md
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$SAVED_ISSUE_NUMBER"
          if [[ -z "$issue_number" ]]; then
            issue_number=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(.title == "RITZZ topic approval - production '"$RITZZ_PRODUCTION_ID"'") | .number' | head -n 1)
          fi
          if [[ -z "$issue_number" ]]; then
            body="$(cat "$CANDIDATE_SUMMARY")"
            body+=$'\n\nReply with exactly one candidate number to approve. Only trusted repository collaborators may approve.'
            issue_number=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" \
              -f "title=RITZZ topic approval - production ${RITZZ_PRODUCTION_ID}" \
              -f "body=$body" --jq '.number')
          fi
          if [[ ! "$issue_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "Could not find or create an approval issue for production $RITZZ_PRODUCTION_ID." >&2
            exit 1
          fi
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Wait for numbered browser selection
        id: wait-for-selection
        env:
          ISSUE_NUMBER: ${{ steps.approval-issue.outputs.issue_number }}
          CANDIDATE_COUNT: ${{ steps.candidate-count.outputs.count }}
        shell: bash
        run: |
          set -euo pipefail
          selection=""
          for attempt in $(seq 1 240); do
            selection=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              --jq '.[] | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR") | .body' \
              | tr -d '\r' \
              | awk -v max="$CANDIDATE_COUNT" '/^[1-5]$/ && $0 <= max {value=$0} END{print value}')
            if [[ "$selection" =~ ^[1-5]$ ]] && (( selection <= CANDIDATE_COUNT )); then
              echo "Selected topic number: $selection"
              echo "selection=$selection" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for a trusted collaborator to reply with a selection from 1 to ${CANDIDATE_COUNT} (attempt $attempt/240)."
            sleep 30
          done
          echo "Timed out waiting for topic selection." >&2
          exit 1

      - name: Persist selected topic
        id: persist-selection
        env:
          RITZZ_SELECTED_TOPIC_NUMBER: ${{ steps.wait-for-selection.outputs.selection }}
        shell: bash
        run: |
          set -euo pipefail
          stage=topic_selection
          python scripts/manage_pipeline_production.py start --stage "$stage"
          trap 'python scripts/manage_pipeline_production.py fail --stage "$stage" --error "Topic selection command failed."' ERR
          python scripts/select_pipeline_topic.py
          python scripts/manage_pipeline_production.py complete --stage "$stage" --artifacts topic_selection.json

      - name: Upload approved topic selection
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-production-${{ needs.restore-production.outputs.production_id }}-topic_selection
          path: .pipeline-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  topic-approval:
    name: Approve selected topic
    needs: [select-topic, restore-production]
    if: ${{ always() && needs.restore-production.result == 'success' && (needs.restore-production.outputs.effective_mode == 'NEW' || needs.restore-production.outputs.resume_from_index <= 1) && needs.select-topic.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ needs.select-topic.outputs.selection }}
    environment:
      name: ritzz-topic-approval
    steps:
      - name: Record topic approval boundary
        run: |
          echo "Topic ${{ needs.select-topic.outputs.selection }} selected."
          echo "Approve this environment to continue into production stages."

  test-approval:
    name: Human approval for test pipeline
    needs: [topic-approval, restore-production]
    if: ${{ always() && needs.restore-production.result == 'success' && (needs.restore-production.outputs.effective_mode == 'NEW' || needs.restore-production.outputs.resume_from_index <= 2) && (needs.topic-approval.result == 'success' || (needs.restore-production.outputs.effective_mode == 'RESUME' && needs.restore-production.outputs.resume_from_index > 1)) }}
    runs-on: ubuntu-latest
    environment:
      name: ritzz-test-approval
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Confirm approval boundary
        run: |
          echo "Test pipeline approved."
          echo "Topic discovery mode: GPT generation with vidIQ keyword-score validation."
          echo "Selected topic number: ${{ needs.topic-approval.outputs.selection }}"
          echo "All output must remain private or unlisted."
          echo "Video generation and publishing stages will be added behind this gate."

  content-preparation:
    name: Research, outline, and script
    needs: [test-approval, select-topic, restore-production]
    if: ${{ always() && needs.restore-production.result == 'success' && needs.test-approval.result == 'success' && (needs.restore-production.outputs.effective_mode == 'NEW' || needs.restore-production.outputs.resume_from_index <= 2) }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VIDIQ_MCP_API_KEY: ${{ secrets.VIDIQ_MCP_API_KEY }}
      RITZZ_PIPELINE_ARTIFACTS: .pipeline-artifacts
      RITZZ_PRODUCTION_ID: ${{ needs.restore-production.outputs.production_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download failed content checkpoint for retry
        if: ${{ needs.restore-production.outputs.effective_mode == 'RESUME' && needs.restore-production.outputs.resume_from_index == '2' && endsWith(needs.restore-production.outputs.source_artifact, '-content_preparation') }}
        uses: actions/download-artifact@v4
        with:
          name: ritzz-production-${{ needs.restore-production.outputs.production_id }}-content_preparation
          run-id: ${{ needs.restore-production.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: .pipeline-artifacts/resume-checkpoint

      - name: Download approved topic
        uses: actions/download-artifact@v4
        with:
          name: ritzz-production-${{ needs.restore-production.outputs.production_id }}-topic_selection
          run-id: ${{ needs.restore-production.outputs.effective_mode == 'RESUME' && needs.restore-production.outputs.resume_from_index == '2' && needs.restore-production.outputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: .pipeline-artifacts

      - name: Restore failed content project and diagnostics
        if: ${{ needs.restore-production.outputs.effective_mode == 'RESUME' && needs.restore-production.outputs.resume_from_index == '2' && endsWith(needs.restore-production.outputs.source_artifact, '-content_preparation') }}
        shell: bash
        run: |
          set -euo pipefail
          checkpoint=.pipeline-artifacts/resume-checkpoint
          cp -a "$checkpoint/." .pipeline-artifacts/
          if [[ -f "$checkpoint/content-project.tar.gz" ]]; then
            mkdir -p projects
            tar -xzf "$checkpoint/content-project.tar.gz" -C projects
          fi

      - name: Run approved content workflow
        id: run-content
        shell: bash
        run: |
          set -euo pipefail
          stage=content_preparation
          python scripts/manage_pipeline_production.py start --stage "$stage"
          trap 'python scripts/manage_pipeline_production.py fail --stage "$stage" --error "Content preparation command failed."' ERR
          python scripts/run_approved_content_workflow.py

      - name: Archive generated project artifacts
        shell: bash
        run: |
          project_id=$(python -c "import json; print(json.load(open('.pipeline-artifacts/content_workflow_result.json'))['project_id'])")
          project_name=$(find projects -mindepth 1 -maxdepth 1 -type d -name "${project_id}_*" -printf "%f\n" | head -n 1)
          tar -czf .pipeline-artifacts/content-project.tar.gz -C projects "$project_name"

      - name: Complete content preparation checkpoint
        shell: bash
        run: |
          project_id=$(python -c "import json; print(json.load(open('.pipeline-artifacts/content_workflow_result.json'))['project_id'])")
          python scripts/manage_pipeline_production.py complete --stage content_preparation --project-id "$project_id" --artifacts content_workflow_result.json content-project.tar.gz

      - name: Upload content artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-production-${{ needs.restore-production.outputs.production_id }}-content_preparation
          path: .pipeline-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

      - name: Upload failed content checkpoint and validation findings
        if: ${{ failure() && hashFiles('.pipeline-artifacts/content_workflow_error.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-production-${{ needs.restore-production.outputs.production_id }}-content_preparation
          path: .pipeline-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  voice-generation:
    name: Generate and validate narration
    needs: [content-preparation, restore-production]
    if: ${{ always() && needs.restore-production.result == 'success' && (needs.restore-production.outputs.effective_mode == 'NEW' || needs.restore-production.outputs.resume_from_index <= 3) && ((needs.content-preparation.result == 'success') || (needs.restore-production.outputs.effective_mode == 'RESUME' && needs.restore-production.outputs.resume_from_index >= 3)) }}
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      RITZZ_VOICE_ID: ${{ secrets.RITZZ_VOICE_ID }}
      RITZZ_PRODUCTION_ID: ${{ needs.restore-production.outputs.production_id }}
      RITZZ_PIPELINE_ARTIFACTS: .pipeline-artifacts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffprobe -version

      - name: Download content project
        if: ${{ needs.restore-production.outputs.rerun_from_stage != 'voice_generation' }}
        uses: actions/download-artifact@v4
        with:
          name: ritzz-production-${{ needs.restore-production.outputs.production_id }}-content_preparation
          run-id: ${{ needs.restore-production.outputs.effective_mode == 'RESUME' && needs.restore-production.outputs.resume_from_index == '3' && needs.restore-production.outputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: .pipeline-artifacts

      - name: Download rerun project
        if: ${{ needs.restore-production.outputs.rerun_from_stage == 'voice_generation' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.restore-production.outputs.source_artifact }}
          run-id: ${{ needs.restore-production.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: .pipeline-artifacts

      - name: Extract content project
        if: ${{ needs.restore-production.outputs.rerun_from_stage != 'voice_generation' }}
        shell: bash
        run: mkdir -p projects && tar -xzf .pipeline-artifacts/content-project.tar.gz -C projects

      - name: Extract rerun project
        if: ${{ needs.restore-production.outputs.rerun_from_stage == 'voice_generation' }}
        shell: bash
        run: mkdir -p projects && tar -xzf .pipeline-artifacts/rerun-project.tar.gz -C projects

      - name: Read project ID
        id: project
        shell: bash
        run: |
          project_id=$(python -c "import json; print(json.load(open('.pipeline-artifacts/content_workflow_result.json'))['project_id'])")
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Generate and validate narration
        shell: bash
        env:
          RITZZ_PROJECT_ID: ${{ steps.project.outputs.project_id }}
          RITZZ_AUDIO_TARGET_LUFS: ${{ vars.RITZZ_AUDIO_TARGET_LUFS || '-14' }}
          RITZZ_AUDIO_TRUE_PEAK_CEILING_DBTP: ${{ vars.RITZZ_AUDIO_TRUE_PEAK_CEILING_DBTP || '-1' }}
        run: |
          set -euo pipefail
          stage=voice_generation
          python scripts/manage_pipeline_production.py start --stage "$stage"
          trap 'python scripts/manage_pipeline_production.py fail --stage "$stage" --error "Voice generation command failed."' ERR
          python scripts/run_voice_stage.py

      - name: Archive voice project artifacts
        shell: bash
        run: |
          project_name=$(find projects -mindepth 1 -maxdepth 1 -type d -name "${{ steps.project.outputs.project_id }}_*" -printf "%f\n" | head -n 1)
          tar -czf .pipeline-artifacts/voice-project.tar.gz -C projects "$project_name"

      - name: Complete voice generation checkpoint
        run: python scripts/manage_pipeline_production.py complete --stage voice_generation --artifacts voice-project.tar.gz

      - name: Upload voice artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-production-${{ needs.restore-production.outputs.production_id }}-voice_generation
          path: .pipeline-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  pipeline-placeholder:
    name: Production stages pending M8 implementation
    needs: [private-upload, restore-production]
    if: ${{ always() && needs.restore-production.result == 'success' && (needs.private-upload.result == 'success' || (needs.restore-production.outputs.effective_mode == 'RESUME' && needs.restore-production.outputs.resume_from_index > 7)) }}
    runs-on: ubuntu-latest
    steps:
      - name: Report current implementation boundary
        run: |
          echo "The CI control plane is active."
          echo "Private test upload completed after human approval."
          echo "Public publication remains disabled for M8/M9 test runs."

  image-generation:
    name: Generate timed-scene images
    needs: [storyboard-generation, restore-production]
    if: ${{ always() && needs.restore-production.result == 'success' && (needs.restore-production.outputs.effective_mode == 'NEW' || needs.restore-production.outputs.resume_from_index <= 5) && ((needs.storyboard-generation.result == 'success') || (needs.restore-production.outputs.effective_mode == 'RESUME' && needs.restore-production.outputs.resume_from_index >= 5)) }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RITZZ_PRODUCTION_ID: ${{ needs.restore-production.outputs.production_id }}
