  video-approval:
    name: Human approval for generated test video
    needs: [render-video, restore-production]
    if: ${{ always() && needs.restore-production.result == 'success' && (needs.render-video.result == 'success' || (needs.restore-production.outputs.effective_mode == 'RESUME' && needs.restore-production.outputs.resume_from_index == '7')) && (needs.restore-production.outputs.effective_mode == 'NEW' || needs.restore-production.outputs.resume_from_index <= 7) }}
