          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Detect a private-upload checkpoint from this workflow attempt
        id: pending-upload
        shell: bash
        run: |
          artifact_name="ritzz-production-${RITZZ_PRODUCTION_ID}-private_upload"
          artifact=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            | jq -r --arg name "$artifact_name" '.artifacts[]? | select(.name == $name and (.expired | not)) | .name' \
            | head -n 1)
          echo "artifact_name=$artifact" >> "$GITHUB_OUTPUT"

      - name: Download rendered project
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.render-video.result == 'success' && format('ritzz-production-{0}-render_video', needs.restore-production.outputs.production_id) || endsWith(needs.restore-production.outputs.source_artifact, '-private_upload') && needs.restore-production.outputs.source_artifact || steps.pending-upload.outputs.artifact_name || needs.restore-production.outputs.source_artifact || format('ritzz-production-{0}-render_video', needs.restore-production.outputs.production_id) }}
          run-id: ${{ needs.render-video.result == 'success' && github.run_id || endsWith(needs.restore-production.outputs.source_artifact, '-private_upload') && needs.restore-production.outputs.source_run_id || steps.pending-upload.outputs.artifact_name != '' && github.run_id || needs.restore-production.outputs.effective_mode == 'RESUME' && needs.restore-production.outputs.resume_from_index == '7' && needs.restore-production.outputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: .pipeline-artifacts

      - name: Extract rendered project
        if: ${{ needs.render-video.result == 'success' || (!endsWith(needs.restore-production.outputs.source_artifact, '-private_upload') && !endsWith(steps.pending-upload.outputs.artifact_name, '-private_upload')) }}
        shell: bash
        run: mkdir -p projects && tar -xzf .pipeline-artifacts/rendered-project.tar.gz -C projects

      - name: Extract pending upload project
        if: ${{ needs.render-video.result != 'success' && (endsWith(needs.restore-production.outputs.source_artifact, '-private_upload') || endsWith(steps.pending-upload.outputs.artifact_name, '-private_upload')) }}
        shell: bash
        run: mkdir -p projects && tar -xzf .pipeline-artifacts/private-upload-project.tar.gz -C projects

      - name: Read project ID
        id: project
        shell: bash
        run: |
          project_id=$(python -c "import json; print(json.load(open('.pipeline-artifacts/content_workflow_result.json'))['project_id'])")
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Write OAuth files from GitHub Secrets
        shell: bash
        run: |
          printf '%s' "$GOOGLE_CLIENT_SECRETS_B64" | base64 --decode > "$RUNNER_TEMP/youtube-client-secrets.json"
          printf '%s' "$GOOGLE_TOKEN_B64" | base64 --decode > "$RUNNER_TEMP/youtube-token.json"

      - name: Persist private upload intent before contacting YouTube
        if: ${{ !endsWith(needs.restore-production.outputs.source_artifact, '-private_upload') && steps.pending-upload.outputs.artifact_name == '' }}
        shell: bash
        run: |
          set -euo pipefail
          stage=private_upload
          python scripts/manage_pipeline_production.py start --stage "$stage"
          python scripts/manage_pipeline_production.py intent --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          project_name=$(find projects -mindepth 1 -maxdepth 1 -type d -name "${{ steps.project.outputs.project_id }}_*" -printf "%f\n" | head -n 1)
          tar -czf .pipeline-artifacts/private-upload-project.tar.gz -C projects "$project_name"

      - name: Start private-upload stage for rerun or saved-result retry
        if: ${{ (needs.restore-production.outputs.rerun_from_stage != '' && endsWith(needs.restore-production.outputs.source_artifact, '-private_upload')) || (needs.restore-production.outputs.effective_mode == 'RESUME' && needs.restore-production.outputs.resume_from_index == '7' && endsWith(needs.restore-production.outputs.source_artifact, '-private_upload')) }}
        run: python scripts/manage_pipeline_production.py start --stage private_upload

      - name: Authorize replacement after confirmed YouTube deletion
        if: ${{ inputs.confirm_deleted_video == true }}
        env:
          RITZZ_PROJECT_ID: ${{ steps.project.outputs.project_id }}
          RITZZ_CONFIRM_DELETED_VIDEO: ${{ inputs.confirm_deleted_video }}
        run: python scripts/authorize_deleted_video_replacement.py

      - name: Upload pending private-upload checkpoint
        if: ${{ !endsWith(needs.restore-production.outputs.source_artifact, '-private_upload') && steps.pending-upload.outputs.artifact_name == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-production-${{ needs.restore-production.outputs.production_id }}-private_upload
          path: .pipeline-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

      - name: Upload test video privately
        shell: bash
        env:
          RITZZ_PROJECT_ID: ${{ steps.project.outputs.project_id }}
          GOOGLE_CLIENT_SECRETS_FILE: ${{ runner.temp }}/youtube-client-secrets.json
          GOOGLE_TOKEN_FILE: ${{ runner.temp }}/youtube-token.json
        run: |
          set -euo pipefail
          stage=private_upload
          trap 'python scripts/manage_pipeline_production.py fail --stage "$stage" --error "Private upload failed or returned an uncertain result."' ERR
          python scripts/run_private_upload_stage.py

      - name: Archive video upload result before thumbnail update
        shell: bash
        run: |
          project_name=$(find projects -mindepth 1 -maxdepth 1 -type d -name "${{ steps.project.outputs.project_id }}_*" -printf "%f\n" | head -n 1)
          tar -czf .pipeline-artifacts/private-upload-project.tar.gz -C projects "$project_name"
          cp "projects/$project_name/publishing/publish.json" .pipeline-artifacts/private-upload-result.json

      - name: Upload YouTube thumbnail
        shell: bash
        env:
          RITZZ_PROJECT_ID: ${{ steps.project.outputs.project_id }}
          GOOGLE_CLIENT_SECRETS_FILE: ${{ runner.temp }}/youtube-client-secrets.json
          GOOGLE_TOKEN_FILE: ${{ runner.temp }}/youtube-token.json
        run: |
          set -euo pipefail
          stage=private_upload
          trap 'python scripts/manage_pipeline_production.py fail --stage "$stage" --artifacts private-upload-result.json private-upload-project.tar.gz --error "Thumbnail upload failed; video result is checkpointed and must not be uploaded again."' ERR
          python scripts/upload_youtube_thumbnail.py

      - name: Archive project with uploaded thumbnail
        shell: bash
        run: |
          project_name=$(find projects -mindepth 1 -maxdepth 1 -type d -name "${{ steps.project.outputs.project_id }}_*" -printf "%f\n" | head -n 1)
          tar -czf .pipeline-artifacts/private-upload-project.tar.gz -C projects "$project_name"
          cp "projects/$project_name/publishing/publish.json" .pipeline-artifacts/private-upload-result.json

      - name: Complete private upload checkpoint
        run: python scripts/manage_pipeline_production.py complete --stage private_upload --artifacts private-upload-result.json private-upload-project.tar.gz

      - name: Upload private upload checkpoint
        if: ${{ always() && steps.project.outputs.project_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-production-${{ needs.restore-production.outputs.production_id }}-private_upload
          path: .pipeline-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  storyboard-generation:
    name: Build audio-timed storyboard
    needs: [voice-generation, restore-production]
    if: ${{ always() && needs.restore-production.result == 'success' && (needs.restore-production.outputs.effective_mode == 'NEW' || needs.restore-production.outputs.resume_from_index <= 4) && ((needs.voice-generation.result == 'success') || (needs.restore-production.outputs.effective_mode == 'RESUME' && needs.restore-production.outputs.resume_from_index >= 4)) }}
    runs-on: ubuntu-latest
    env:
      RITZZ_PRODUCTION_ID: ${{ needs.restore-production.outputs.production_id }}
      RITZZ_PIPELINE_ARTIFACTS: .pipeline-artifacts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download voice project
        if: ${{ needs.restore-production.outputs.rerun_from_stage != 'storyboard_generation' }}
        uses: actions/download-artifact@v4
        with:
          name: ritzz-production-${{ needs.restore-production.outputs.production_id }}-voice_generation
          run-id: ${{ needs.restore-production.outputs.effective_mode == 'RESUME' && needs.restore-production.outputs.resume_from_index == '4' && needs.restore-production.outputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: .pipeline-artifacts

      - name: Download rerun project
        if: ${{ needs.restore-production.outputs.rerun_from_stage == 'storyboard_generation' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.restore-production.outputs.source_artifact }}
          run-id: ${{ needs.restore-production.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: .pipeline-artifacts

      - name: Extract voice project
        if: ${{ needs.restore-production.outputs.rerun_from_stage != 'storyboard_generation' }}
        shell: bash
        run: mkdir -p projects && tar -xzf .pipeline-artifacts/voice-project.tar.gz -C projects

      - name: Extract rerun project
        if: ${{ needs.restore-production.outputs.rerun_from_stage == 'storyboard_generation' }}
        shell: bash
        run: mkdir -p projects && tar -xzf .pipeline-artifacts/rerun-project.tar.gz -C projects

      - name: Read project ID
        id: project
        shell: bash
        run: |
          project_id=$(python -c "import json; print(json.load(open('.pipeline-artifacts/content_workflow_result.json'))['project_id'])")
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Build narrative and audio-timed storyboards
        shell: bash
        env:
          RITZZ_PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          stage=storyboard_generation
          python scripts/manage_pipeline_production.py start --stage "$stage"
          trap 'python scripts/manage_pipeline_production.py fail --stage "$stage" --error "Storyboard generation command failed."' ERR
          python scripts/run_storyboard_stage.py

      - name: Archive storyboard project artifacts
        shell: bash
        run: |
          project_name=$(find projects -mindepth 1 -maxdepth 1 -type d -name "${{ steps.project.outputs.project_id }}_*" -printf "%f\n" | head -n 1)
          tar -czf .pipeline-artifacts/storyboard-project.tar.gz -C projects "$project_name"

      - name: Complete storyboard checkpoint
        run: python scripts/manage_pipeline_production.py complete --stage storyboard_generation --artifacts storyboard-project.tar.gz

      - name: Upload storyboard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ritzz-production-${{ needs.restore-production.outputs.production_id }}-storyboard_generation
          path: .pipeline-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
