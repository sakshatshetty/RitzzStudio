name: Set up verified FFmpeg
description: Install checksum-verified FFmpeg and FFprobe binaries without apt
runs:
  using: composite
  steps:
    - name: Download and verify FFmpeg
      shell: bash
      run: |
        set -euo pipefail

        archive="$RUNNER_TEMP/ritzz-ffmpeg.tar.xz"
        checksum_file="$RUNNER_TEMP/ritzz-ffmpeg-checksums.sha256"
        install_dir="$RUNNER_TEMP/ritzz-ffmpeg"
        release_url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest"
        archive_name="ffmpeg-master-latest-linux64-gpl.tar.xz"

        curl --fail --location --retry 2 --connect-timeout 10 --max-time 300 \
          "$release_url/checksums.sha256" \
          --output "$checksum_file"
        curl --fail --location --retry 2 --connect-timeout 10 --max-time 300 \
          "$release_url/$archive_name" \
          --output "$archive"

        mapfile -t matching_checksums < <(
          awk -v filename="$archive_name" '$2 == filename { print $1 }' "$checksum_file"
        )
        if (( ${#matching_checksums[@]} != 1 )) \
          || [[ ! "${matching_checksums[0]}" =~ ^[[:xdigit:]]{64}$ ]]; then
          echo "Could not find exactly one valid SHA-256 for $archive_name." >&2
          exit 1
        fi
        if ! echo "${matching_checksums[0]}  $archive" | sha256sum --check --status; then
          echo "Downloaded FFmpeg archive failed SHA-256 verification." >&2
          exit 1
        fi

        mkdir -p "$install_dir"
        tar --extract --xz --file "$archive" --directory "$install_dir" --strip-components=1
        rm -- "$archive"

        test -x "$install_dir/bin/ffmpeg" || {
          echo "FFmpeg archive did not contain bin/ffmpeg." >&2
          exit 1
        }
        test -x "$install_dir/bin/ffprobe" || {
          echo "FFmpeg archive did not contain bin/ffprobe." >&2
          exit 1
        }

        echo "$install_dir/bin" >> "$GITHUB_PATH"
        echo "RITZZ_FFMPEG_PATH=$install_dir/bin/ffmpeg" >> "$GITHUB_ENV"
        echo "RITZZ_FFPROBE_PATH=$install_dir/bin/ffprobe" >> "$GITHUB_ENV"
        "$install_dir/bin/ffmpeg" -version
        "$install_dir/bin/ffprobe" -version
